<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РНП — CarBase</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800;900&family=Geologica:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080810;--s1:#0f0f1a;--s2:#161625;--s3:#1e1e30;
  --border:rgba(255,255,255,0.07);--text:#eeeef8;--muted:#606080;
  --accent:#7c6fff;--green:#00d68f;--red:#ff4d6d;--orange:#ffaa00;--blue:#00b4ff;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Geologica',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
.app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:220px;min-width:220px;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform 0.3s;z-index:200}
.sidebar-logo{padding:18px 18px 14px;border-bottom:1px solid var(--border)}
.logo-mark{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:900;color:var(--accent)}
.logo-sub{font-size:10px;color:var(--muted);margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 16px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 16px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s;border-left:2px solid transparent;white-space:nowrap}
.nav-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.nav-item:hover{color:var(--text);background:var(--s2)}
.nav-item.active{color:var(--text);background:var(--s2);border-left-color:var(--accent)}
.sidebar-bottom{padding:10px 12px;border-top:1px solid var(--border)}
.month-sel{width:100%;background:var(--s2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-family:'Geologica',sans-serif;font-size:12px;cursor:pointer;outline:none}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--s1);flex-shrink:0;flex-wrap:wrap}
.back-btn{background:var(--s2);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:7px;font-size:12px;cursor:pointer;font-family:'Geologica',sans-serif;display:none;align-items:center;gap:5px;white-space:nowrap}
.back-btn:hover{color:var(--text);border-color:var(--accent)}
.page-title{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;flex:1}
.menu-btn{display:none;background:var(--s2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;cursor:pointer;font-size:15px}

/* DATE RANGE PICKER */
.daterange{display:flex;align-items:center;gap:6px;background:var(--s2);padding:5px 10px;border-radius:8px;border:1px solid var(--border)}
.daterange label{font-size:11px;color:var(--muted)}
.daterange input[type=date]{background:transparent;border:none;color:var(--text);font-family:'Geologica',sans-serif;font-size:12px;outline:none;cursor:pointer;min-width:110px}
.daterange input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.5);cursor:pointer}
.daterange span{color:var(--muted);font-size:11px}
.btn-apply{background:var(--accent);color:#fff;border:none;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Geologica',sans-serif}

.content{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:2px}

/* NETWORK BANNER */
.network-banner{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.nb-title{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.nb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.nb-item{display:flex;flex-direction:column;gap:2px}
.nb-label{font-size:10px;color:var(--muted);font-weight:500}
.nb-value{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.5px}
.nb-sub{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap}
.nb-plan{font-size:11px;color:var(--muted)}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700}
.tag-green{background:rgba(0,214,143,.12);color:var(--green)}
.tag-red{background:rgba(255,77,109,.12);color:var(--red)}
.tag-orange{background:rgba(255,170,0,.12);color:var(--orange)}
.tag-blue{background:rgba(0,180,255,.12);color:var(--blue)}
.nb-divider{border:none;border-top:1px solid var(--border);margin:14px 0}

/* LOC CARDS */
.loc-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.loc-card{background:var(--s1);border:1px solid var(--border);border-top:2px solid transparent;border-radius:var(--r);padding:18px 20px;cursor:pointer;transition:all .2s}
.loc-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.15)}
.lc-name{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:700;margin-bottom:8px}
.lc-main{font-family:'Unbounded',sans-serif;font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:8px;white-space:nowrap}
.lc-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.lc-stat{font-size:14px;color:var(--muted)}
.lc-stat span{color:var(--text);font-weight:600}
.lc-forecast{font-size:14px;color:var(--orange);margin-top:6px}
.lc-split{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.lc-split-item{font-size:13px}
.lc-split-label{color:var(--muted);margin-bottom:1px}
.lc-split-val{font-weight:600}

/* CHART */
.chart-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.ch-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.ch-title{font-size:13px;font-weight:600}
.ch-tabs{display:flex;gap:3px;background:var(--s2);padding:3px;border-radius:7px}
.ctab{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s}
.ctab.active{background:var(--s3);color:var(--text)}
.ch-wrap{position:relative;height:190px}

/* TABLE */
.table-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.table-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}
.table-title{font-size:13px;font-weight:600}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--s2);padding:7px 10px;text-align:left;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1}
th.r,td.r{text-align:right}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.02)}
td{padding:7px 10px;white-space:nowrap}
td.muted{color:var(--muted);font-size:11px}
.week-row td{background:rgba(255,255,255,.02);color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-top:1px solid var(--border)}
.total-row td{font-weight:700;background:var(--s2)}
.badge{display:inline-flex;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700}
.badge-m{background:rgba(0,214,143,.1);color:var(--green);border:1px solid rgba(0,214,143,.2)}
.badge-d{background:rgba(0,180,255,.1);color:var(--blue);border:1px solid rgba(0,180,255,.2)}

/* METRIC CARDS 9-grid */
.metrics-9{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.mc-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mc-value{font-family:'Unbounded',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.3px;margin-bottom:8px}
.mc-rows{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.mc-row{font-size:10px;color:var(--muted)}
.mc-row span{color:var(--text);font-weight:600}

/* UPLOAD */
.upload-zone{border:2px dashed var(--border);border-radius:var(--r);padding:40px 24px;text-align:center;cursor:pointer;transition:all .2s;position:relative;background:var(--s1)}
.upload-zone:hover,.upload-zone.over{border-color:var(--accent);background:rgba(124,111,255,.05)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-icon{font-size:32px;margin-bottom:10px}
.upload-title{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;margin-bottom:5px}
.upload-sub{font-size:12px;color:var(--muted)}

/* RESULT */
.result-card{background:var(--s1);border:1px solid var(--green);border-radius:var(--r);padding:14px;margin-top:12px}
.result-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.result-row:last-child{border-bottom:none}
.result-val{margin-left:auto;font-weight:600}

/* SETTINGS */
.settings-tbl{width:100%;border-collapse:collapse;font-size:12px}
.settings-tbl th{background:var(--s2);padding:7px 10px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);text-align:center}
.settings-tbl td{border:1px solid var(--border);padding:5px 8px}
.settings-tbl td:first-child{font-weight:600;background:var(--s2);white-space:nowrap}
.s-inp{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 7px;border-radius:5px;font-family:'Geologica',sans-serif;font-size:12px;outline:none;text-align:right;min-width:90px}
.s-inp:focus{border-color:var(--accent)}

/* BTN */
.btn{padding:7px 16px;border-radius:7px;font-family:'Geologica',sans-serif;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-green{background:var(--green);color:#000}

.sec-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* OVERLAY & MOBILE */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;backdrop-filter:blur(4px)}
.overlay.show{display:block}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--border);z-index:200;padding:5px 0 env(safe-area-inset-bottom)}
.mobile-nav-items{display:flex;justify-content:space-around}
.mni{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 8px;cursor:pointer;color:var(--muted);transition:color .15s;font-size:10px;font-weight:500}
.mni.active{color:var(--accent)}
.mni-icon{font-size:17px}

.toast{position:fixed;bottom:70px;right:14px;background:var(--s2);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:9px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}

@media(max-width:900px){.nb-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .banner-grid{grid-template-columns:1fr 1fr!important}
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex;align-items:center}
  .mobile-nav{display:block}
  .content{padding:10px;padding-bottom:75px;gap:10px}
  .loc-cards{grid-template-columns:1fr}
  .metrics-9{grid-template-columns:1fr 1fr}
  .topbar{padding:9px 12px;gap:7px}
  .daterange{display:none}
  .ch-wrap{height:180px}
  .nb-grid{grid-template-columns:repeat(2,1fr)}
  .network-banner [style*="grid-template-columns:1fr 1fr 1fr 1fr"]{display:flex;flex-direction:column}
  .lc-main{font-size:22px}
  .mc-value{font-size:22px!important}
  .mc{min-width:0}
  table{font-size:11px}
  td,th{padding:5px 8px}
  .page-title{font-size:12px}
  .logo-mark{font-size:13px}
  .obj-cards-grid{grid-template-columns:1fr!important}
}
@media(max-width:480px){
  .loc-cards{grid-template-columns:1fr}
  .metrics-9{grid-template-columns:1fr}
  .cards-grid-6{grid-template-columns:1fr}
}
@media(max-width:480px){
  .loc-cards{grid-template-columns:1fr}
  .metrics-9{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">

<div class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">CarBase РНП</div>
    <div class="logo-sub">Ежедневный отчёт по сети</div>
  </div>
  <div class="nav">
    <div class="nav-label">Главное</div>
    <div class="nav-item active" onclick="go('summary')" id="nav-summary"><span>📊</span>Сводка</div>
    <div class="nav-label">Объекты</div>
    <div class="nav-item" onclick="go('loc','oceania')" id="nav-oceania"><span class="dot" style="background:#7c6fff"></span>Океания</div>
    <div class="nav-item" onclick="go('loc','horoshevo')" id="nav-horoshevo"><span class="dot" style="background:#00d68f"></span>Хорошо</div>
    <div class="nav-item" onclick="go('loc','galereya')" id="nav-galereya"><span class="dot" style="background:#ff6b9d"></span>Галерея</div>
    <div class="nav-item" onclick="go('loc','sochi')" id="nav-sochi"><span class="dot" style="background:#00b4ff"></span>Сочи</div>
    <div class="nav-item" onclick="go('loc','kazan')" id="nav-kazan"><span class="dot" style="background:#ffaa00"></span>Казань</div>
    <div class="nav-item" onclick="go('loc','serpuhovka')" id="nav-serpuhovka"><span class="dot" style="background:#ff7f50"></span>Серпуховка</div>
    <div class="nav-label">Система</div>
    <div class="nav-item" onclick="go('compare')" id="nav-compare"><span>📈</span>Сравнение</div>
    <div class="nav-item" onclick="go('upload')" id="nav-upload"><span>📤</span>Загрузка данных</div>
    <div class="nav-item" onclick="go('settings')" id="nav-settings"><span>⚙️</span>Настройки плана</div>
  </div>
  <div class="sidebar-bottom">
    <select class="month-sel" id="monthSel" onchange="onMonthChange()">
      <option value="2026-05">Май 2026</option>
      <option value="2026-04" selected>Апрель 2026</option>
      <option value="2026-03">Март 2026</option>

</div>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="main">
  <div class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <button class="back-btn" id="backBtn" onclick="go('summary')">← Назад</button>
    <div class="page-title" id="pageTitle">Сводка</div>
    <div class="daterange">
      <label>С</label>
      <input type="date" id="dateFrom" value="2026-05-01">
      <span>—</span>
      <label>По</label>
      <input type="date" id="dateTo" value="2026-05-31">
      <button class="btn-apply" onclick="applyDates()">OK</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="mobile-nav">
  <div class="mobile-nav-items">
    <div class="mni active" onclick="go('summary')" id="mnav-summary"><span class="mni-icon">📊</span>Сводка</div>
    <div class="mni" onclick="toggleSidebar()" id="mnav-locs"><span class="mni-icon">📍</span>Объекты</div>
    <div class="mni" onclick="go('upload')" id="mnav-upload"><span class="mni-icon">📤</span>Загрузка</div>
    <div class="mni" onclick="go('compare')" id="mnav-compare"><span class="mni-icon">📈</span>Сравнение</div>
    <div class="mni" onclick="go('settings')" id="mnav-settings"><span class="mni-icon">⚙️</span>План</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===================== SUPABASE =====================
const SUPABASE_URL = 'https://szfbwryicsgrrktcoyib.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Z_CfWEoMwkKEw5N69-taeA_O3iRkut-';

async function sbFetch(path, options={}){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || 'return=minimal',
      ...options.headers
    }
  });
  if(!res.ok){
    const err = await res.text();
    throw new Error(err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function loadAllData(){
  try{
    showToast('⏳ Загружаем данные...');
    const rows = await sbFetch('daily_data?select=*&order=date.asc', {headers:{'Prefer':'return=representation'}});
    if(!rows || rows.length===0){ showToast('База пустая — используем встроенные данные'); return; }
    
    // Reset ALL_DATA
    Object.keys(ALL_DATA).forEach(k => delete ALL_DATA[k]);
    
    rows.forEach(r => {
      const ym = r.month;
      const loc = r.location;
      const dt = r.date;
      if(!ALL_DATA[ym]) ALL_DATA[ym] = {};
      if(!ALL_DATA[ym][loc]) ALL_DATA[ym][loc] = {};
      ALL_DATA[ym][loc][dt] = {
        mRev: +r.m_rev||0, mCars: +r.m_cars||0,
        dRev: +r.d_rev||0, dCars: +r.d_cars||0,
        mRevPrev: +r.m_rev_prev||0, mCarsPrev: +r.m_cars_prev||0,
        dRevPrev: +r.d_rev_prev||0, dCarsPrev: +r.d_cars_prev||0,
      };
    });
    
    // Load plan
    const planRows = await sbFetch('monthly_plan?select=*', {headers:{'Prefer':'return=representation'}});
    if(planRows && planRows.length>0){
      planRows.forEach(r => {
        PLAN[r.location] = {
          revTotal: +r.rev_total||0, carsTotal: +r.cars_total||0,
          revM: +r.rev_m||0, carsM: +r.cars_m||0,
          revD: +r.rev_d||0, carsD: +r.cars_d||0,
        };
      });
    }
    
    showToast('✓ Данные загружены из базы');
    destroyCharts(); render();
  } catch(e) {
    console.error('Supabase load error:', e);
    showToast('⚠️ Ошибка загрузки — используем встроенные данные');
  }
}

async function saveMonthData(month, locData){
  const rows = [];
  for(const [loc, daily] of Object.entries(locData)){
    for(const [dt, v] of Object.entries(daily)){
      rows.push({
        location: loc,
        date: dt,
        month: month,
        m_rev: v.mRev||0, m_cars: v.mCars||0,
        d_rev: v.dRev||0, d_cars: v.dCars||0,
        m_rev_prev: v.mRevPrev||0, m_cars_prev: v.mCarsPrev||0,
        d_rev_prev: v.dRevPrev||0, d_cars_prev: v.dCarsPrev||0,
      });
    }
  }
  
  // Upsert in batches of 100
  for(let i=0; i<rows.length; i+=100){
    const batch = rows.slice(i, i+100);
    await sbFetch('daily_data?on_conflict=location,date,month', {
      method: 'POST',
      headers: {'Prefer': 'resolution=merge-duplicates,return=minimal'},
      body: JSON.stringify(batch)
    });
  }
}

async function savePlanToDb(){
  const rows = Object.entries(PLAN).map(([loc, p]) => ({
    location: loc,
    month: currentMonth,
    rev_total: p.revTotal||0, cars_total: p.carsTotal||0,
    rev_m: p.revM||0, cars_m: p.carsM||0,
    rev_d: p.revD||0, cars_d: p.carsD||0,
  }));
  await sbFetch('monthly_plan?on_conflict=location,month', {
    method: 'POST',
    headers: {'Prefer': 'resolution=merge-duplicates,return=minimal'},
    body: JSON.stringify(rows)
  });

// ===================== HELPERS =====================
function fmt(n){return Math.round(n||0).toLocaleString('ru-RU')}
function getFiltered(loc){
  // Merge data from all months that overlap with date range
  const merged={};
  Object.values(ALL_DATA).forEach(monthData=>{
    const locData=monthData[loc]||{};
    Object.entries(locData).forEach(([dt,v])=>{
      if(dt>=dateFrom&&dt<=dateTo) merged[dt]=v;
    });
  });
  return Object.fromEntries(Object.entries(merged).sort((a,b)=>a[0].localeCompare(b[0])));
}
function sumLoc(loc){
  // Use ALL_DATA for current month
  const monthData=ALL_DATA[currentMonth];
  const locData=monthData?monthData[loc]||{}:RAW_DATA[loc]||{};
  return Object.values(locData).reduce((a,v)=>({
    mRev:a.mRev+(v.mRev||0)+(v.mRevPrev||0),
    mCars:a.mCars+(v.mCars||0)+(v.mCarsPrev||0),
    dRev:a.dRev+(v.dRev||0)+(v.dRevPrev||0),
    dCars:a.dCars+(v.dCars||0)+(v.dCarsPrev||0),
    mRevPrev:a.mRevPrev+(v.mRevPrev||0),
    mCarsPrev:a.mCarsPrev+(v.mCarsPrev||0),
    dRevPrev:a.dRevPrev+(v.dRevPrev||0),
    dCarsPrev:a.dCarsPrev+(v.dCarsPrev||0),
  }),{mRev:0,mCars:0,dRev:0,dCars:0,mRevPrev:0,mCarsPrev:0,dRevPrev:0,dCarsPrev:0});
}
function forecast(fact){
  const f=new Date(dateFrom),t=new Date(dateTo);
  const now=new Date();
  now.setHours(0,0,0,0);
  // If period fully in past - forecast = fact
  if(t<now) return fact;
  // If period fully in future - no forecast
  if(f>now) return null;
  const totalDays=(t-f)/86400000+1;
  const passed=Math.min((now-f)/86400000+1,totalDays);
  if(passed<=0) return fact;
  return Math.round(fact/passed*totalDays);
}
function fmtFc(val){
  if(val===null) return '—';
  return fmt(val)+' ₽';
}
function fmtFcNum(val){
  if(val===null) return '—';
  return fmt(val);
}
function pctColor(pct){
  if(!pct)return'var(--muted)';
  return pct>=100?'var(--green)':pct>=70?'var(--orange)':'var(--red)';
}
function pctTag(fact,plan){
  if(!plan)return'';
  const p=Math.round(fact/plan*100);
  const cls=p>=100?'tag-green':p>=70?'tag-orange':'tag-red';
  return`<span class="tag ${cls}">${p}%</span>`;
}

function go(p,loc){

  if(p==='summary'){

  } else if(p==='loc'){
    document.getElementById('nav-'+loc).classList.add('active');
    document.getElementById('mnav-locs').classList.add('active');

}

function applyDates(){
  dateFrom=document.getElementById('dateFrom').value;
  dateTo=document.getElementById('dateTo').value;
  destroyCharts();render();
}
function onMonthChange(){
  const m=document.getElementById('monthSel').value;
  const [y,mo]=m.split('-');
  const last=new Date(+y,+mo,0).getDate();
  dateFrom=`${m}-01`;dateTo=`${m}-${String(last).padStart(2,'0')}`;
  document.getElementById('dateFrom').value=dateFrom;
  document.getElementById('dateTo').value=dateTo;
  destroyCharts();render();
}

function switchSChart(type,el){
  document.querySelectorAll('#content .ctab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if(charts.s){charts.s.destroy();delete charts.s;}
  initSChart(type);
}

function initSChart(type){
  const canvas=document.getElementById('sChart');if(!canvas)return;
  const allDates=[...new Set(LOC_ORDER.flatMap(l=>Object.keys(getFiltered(l))))].sort();
  const datasets=LOC_ORDER.map(loc=>{
    const d=getFiltered(loc);
    return{
      label:LOCS[loc].name,
      data:allDates.map(dt=>{const v=d[dt];if(!v)return null;return type==='total'?v.mRev+v.dRev:type==='moika'?v.mRev:v.dRev;}),
      borderColor:LOCS[loc].color,backgroundColor:LOCS[loc].color+'20',
      borderWidth:2,pointRadius:2,tension:.3,spanGaps:true,
    };
  });
  charts.s=new Chart(canvas,{type:'line',data:{labels:allDates.map(d=>d.slice(8)),datasets},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#606080',font:{size:10},boxWidth:10}}},
      scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#606080',font:{size:9}}},
              y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#606080',font:{size:9},callback:v=>{if(v>=1000000)return(v/1000000).toFixed(1)+'М';if(v>=1000)return Math.round(v/1000)+'К';return v;}}}}}
  });
}

// ---- COMPARE HELPERS ----
function getPrevMonth(ym){
  const [y,m]=ym.split('-').map(Number);
  if(m===1)return`${y-1}-12`;
  return`${y}-${String(m-1).padStart(2,'0')}`;
}

function sumLocByMonth(loc,ym){
  // Use ALL_DATA which has data for all months
  const monthData=ALL_DATA[ym];
  if(monthData){
    const locData=monthData[loc]||{};
    return Object.values(locData).reduce((a,v)=>({
      mRev:a.mRev+(v.mRev||0)+(v.mRevPrev||0),
      mCars:a.mCars+(v.mCars||0)+(v.mCarsPrev||0),
      dRev:a.dRev+(v.dRev||0)+(v.dRevPrev||0),
      dCars:a.dCars+(v.dCars||0)+(v.dCarsPrev||0),
      mRevPrev:a.mRevPrev+(v.mRevPrev||0),
      dRevPrev:a.dRevPrev+(v.dRevPrev||0),
    }),{mRev:0,mCars:0,dRev:0,dCars:0,mRevPrev:0,dRevPrev:0});
  }
  // Fallback: search RAW_DATA by date prefix
  return Object.entries(RAW_DATA[loc]||{})
    .filter(([dt])=>dt.startsWith(ym))
    .reduce((a,[,v])=>({
      mRev:a.mRev+(v.mRev||0)+(v.mRevPrev||0),
      mCars:a.mCars+(v.mCars||0)+(v.mCarsPrev||0),
      dRev:a.dRev+(v.dRev||0)+(v.dRevPrev||0),
      dCars:a.dCars+(v.dCars||0)+(v.dCarsPrev||0),
      mRevPrev:a.mRevPrev+(v.mRevPrev||0),
      dRevPrev:a.dRevPrev+(v.dRevPrev||0),
    }),{mRev:0,mCars:0,dRev:0,dCars:0,mRevPrev:0,dRevPrev:0});
}

function classifySvc(s){
  s=String(s);
  if(/переобувк|хранение рез|шиномонтаж|балансировк/i.test(s)) return 'shino';
  if(/\. Д /.test(s)||s.startsWith('Д ')||s.startsWith('Д.-')||s.includes('Д - ')||s.includes('Д-')) return 'dc';
  if(/ М /.test(s)||s.includes('М -')||s.includes('М-')||s.startsWith('М.')) return 'moika';
  if(/\d+\.\s*M\s*-/.test(s)) return 'moika';
  if(/такси мойка|комплекс|стандарт|озонац|химчистка всех сидений|такси химчистка/i.test(s)) return 'moika';
  return null;
}

function detectAddr(addr){
  const a=String(addr).toLowerCase();
  if(a.includes('кутузовский')) return 'oceania';
  if(a.includes('хорошев')||a.includes('хорошов')) return 'horoshevo';
  if(a.includes('лиговский')) return 'galereya';
  if(a.includes('большая красная')) return 'kazan';
  if(a.includes('новая заря')||a.includes('моремолл')) return 'sochi';
  if(a.includes('серпуховская')||a.includes('серпуховск')) return 'serpuhovka';
  return null;
}

function processFile(file){
  document.getElementById('uResult').innerHTML=`<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">⏳ Обрабатываем файл...</div>`;
  const selMonth=document.getElementById('uploadMonth');
  const targetMonth=selMonth?selMonth.value:currentMonth;

  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'binary',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      parseAndSaveRows(rows, targetMonth, file.name);
    }catch(err){
      document.getElementById('uResult').innerHTML=`<div class="result-card" style="border-color:var(--red);margin-top:12px"><div style="color:var(--red)">❌ Ошибка: ${err.message}</div></div>`;
    }
  };
  r.readAsBinaryString(file);
}

function parseAndSaveRows(rows, targetMonth, filename){
  const keys=Object.keys(rows[0]||{});
  console.log('Columns found:', keys);
  console.log('First row:', rows[0]);
  const orderCol=keys.find(k=>k.includes('заказ'))||'№ заказ-наряда';
  const dateCol=keys.find(k=>k.toLowerCase()==='дата')||'Дата';
  const svcCol=keys.find(k=>k.includes('слуг'))||'Услуга';
  const sumCol=keys.find(k=>k.includes('умм'))||'Сумма';
  const addrCol=keys.find(k=>k.includes('Адрес'))||'Адрес оказания услуг';
  console.log('Cols:', {orderCol, dateCol, svcCol, sumCol, addrCol});

  const orderMap={};
  for(const row of rows){
    const o=String(row[orderCol]||'').trim();
    if(!o||o==='nan') continue;
    const tp=classifySvc(row[svcCol]);
    const amt=parseFloat(row[sumCol])||0;
    const dt=row[dateCol];
    let dateStr;
    if(dt instanceof Date){
      const y=dt.getFullYear(),m=String(dt.getMonth()+1).padStart(2,'0'),d=String(dt.getDate()).padStart(2,'0');
      dateStr=`${y}-${m}-${d}`;
    } else {
      const match=String(dt).match(/(\d{4}-\d{2}-\d{2})/);
      dateStr=match?match[1]:null;
    }
    if(!dateStr) continue;
    const loc=detectAddr(row[addrCol]);
    if(!loc) continue;
    if(!orderMap[o]) orderMap[o]={date:dateStr,loc,mSum:0,dSum:0,shinoSum:0,hasTyped:false};
    if(tp==='moika'){orderMap[o].mSum+=amt;orderMap[o].hasTyped=true;}
    else if(tp==='dc'){orderMap[o].dSum+=amt;orderMap[o].hasTyped=true;}
    else if(tp==='shino'){orderMap[o].shinoSum+=amt;orderMap[o].hasTyped=true;}
  }

  // Build daily data per location
  const newData={};
  let totalOrders=0,ignored=0;
  const locStats={};

  for(const [,v] of Object.entries(orderMap)){
    if(!v.hasTyped){ignored++;continue;}
    const {date,loc}=v;
    const isPrev=!date.startsWith(targetMonth);
    if(!newData[loc]) newData[loc]={};
    if(!newData[loc][date]) newData[loc][date]={mRev:0,mCars:0,dRev:0,dCars:0,mRevPrev:0,mCarsPrev:0,dRevPrev:0,dCarsPrev:0};
    const dcTotal=v.dSum+v.shinoSum;
    const total=v.mSum+dcTotal;
    if(dcTotal>v.mSum){
      if(isPrev){newData[loc][date].dRevPrev+=total;newData[loc][date].dCarsPrev++;}
      else{newData[loc][date].dRev+=total;newData[loc][date].dCars++;}
    } else {
      if(isPrev){newData[loc][date].mRevPrev+=total;newData[loc][date].mCarsPrev++;}
      else{newData[loc][date].mRev+=total;newData[loc][date].mCars++;}
    }
    totalOrders++;
    if(!locStats[loc]) locStats[loc]={m:0,d:0,mRev:0,dRev:0};
    if(dcTotal>v.mSum){locStats[loc].d++;locStats[loc].dRev+=total;}
    else{locStats[loc].m++;locStats[loc].mRev+=total;}
  }

  // Round all values
  for(const loc of Object.keys(newData))
    for(const dt of Object.keys(newData[loc]))
      for(const k of Object.keys(newData[loc][dt]))
        newData[loc][dt][k]=Math.round(newData[loc][dt][k]);

  // Save to ALL_DATA (local)
  ALL_DATA[targetMonth]=newData;
  
  // Save to Supabase
  saveMonthData(targetMonth, newData).then(()=>{
    showToast('✓ Данные сохранены в базу');
  }).catch(e=>{
    console.error('Save error:', e);
    showToast('⚠️ Ошибка сохранения в базу');
  });

  // Show result
  const MONTH_NAMES={'2026-01':'Январь','2026-02':'Февраль','2026-03':'Март','2026-04':'Апрель','2026-05':'Май','2026-06':'Июнь'};
  let locRows=Object.entries(locStats).map(([loc,s])=>
    `<div class="result-row"><span style="width:8px;height:8px;border-radius:50%;background:${LOCS[loc].color};display:inline-block"></span>${LOCS[loc].name}<span class="result-val">${fmt(s.mRev+s.dRev)} ₽ · ${s.m+s.d} авто</span></div>`
  ).join('');

  document.getElementById('uResult').innerHTML=`
    <div class="result-card" style="margin-top:12px;border-color:var(--green)">
      <div class="result-row"><span>📁</span>Файл<span class="result-val">${filename}</span></div>
      <div class="result-row"><span>📅</span>Месяц<span class="result-val" style="color:var(--accent)">${MONTH_NAMES[targetMonth]||targetMonth} 2026</span></div>
      <div class="result-row"><span>📋</span>Заказов обработано<span class="result-val">${totalOrders.toLocaleString('ru-RU')}</span></div>
      <div class="result-row"><span>⚪</span>Проигнорировано<span class="result-val" style="color:var(--muted)">${ignored}</span></div>
      ${locRows}
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-primary" onclick="currentMonth='${targetMonth}';onMonthChange2&&onMonthChange2();go('summary');showToast('✓ Переключились на ${MONTH_NAMES[targetMonth]||targetMonth}')">Смотреть сводку →</button>
    </div>`;

  showToast('✓ Данные загружены за ${MONTH_NAMES[targetMonth]||targetMonth}');
}

  const d=getFiltered(loc);const dates=Object.keys(d).sort();
  const lines=['Дата;Выр.Мойка;Авто М;Ср.чек М;Выр.ДЦ;Авто ДЦ;Ср.чек ДЦ'];
  dates.forEach(dt=>{const v=d[dt];lines.push([dt,v.mRev,v.mCars,v.mCars?Math.round(v.mRev/v.mCars):0,v.dRev,v.dCars,v.dCars?Math.round(v.dRev/v.dCars):0].join(';'));});
  const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`РНП_${LOCS[loc].name}_${dateFrom}_${dateTo}.csv`;a.click();
  showToast('CSV скачан');
}

// ---- UI ----
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// INIT
go('summary');
loadAllData();
</script>
